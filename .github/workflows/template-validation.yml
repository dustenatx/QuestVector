name: "QuestVector Template Validation"

# Validates every mission template in templates/ with the project's own
# `qv template validate`. All templates are checked on each run rather than
# only the changed ones: the set is small, and it avoids a third-party
# changed-files action and the diff-base edge cases that come with one.

on:
  pull_request:
    branches: [main]
    paths:
      - "templates/**.yaml"
      - "templates/**.yml"
      - "questvector/core/templates.py"
      - ".github/workflows/template-validation.yml"
  push:
    branches: [main]
    paths:
      - "templates/**.yaml"
      - "templates/**.yml"
      - "questvector/core/templates.py"
      - ".github/workflows/template-validation.yml"
  workflow_dispatch:

# Read-only token: results go to the run summary, not a PR comment, so this
# also works on pull requests from forks.
permissions:
  contents: read

jobs:
  validate-templates:
    name: "Validate mission templates"
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install QuestVector
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Validate templates
        shell: bash
        run: |
          set -uo pipefail

          mapfile -d '' files < <(find templates -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 | sort -z)

          {
            echo "## Mission template validation"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No templates found under templates/." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "| Template | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for file in "${files[@]}"; do
            echo "::group::$file"
            if output=$(qv template validate "$file" 2>&1); then
              result="✅ valid"
            else
              result="❌ invalid"
              failed=$((failed + 1))
              echo "::error file=$file::Template validation failed"
            fi
            echo "$output"
            echo "::endgroup::"

            # Collapse output to one line and escape table pipes for the summary.
            detail=$(printf '%s' "$output" | tr '\n' ' ' | sed 's/|/\\|/g')
            safe_file=$(printf '%s' "$file" | sed 's/|/\\|/g')
            echo "| \`$safe_file\` | $result — $detail |" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo
            echo "**${#files[@]} checked, $failed failed.**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            {
              echo
              echo "Run \`qv template validate <path> --fix\` locally to rescale category weights to 1.00. Other errors (YAML syntax, missing fields) need a manual edit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
