name: "QuestVector Template Validation"

# Validates every mission template in templates/ with the project's own
# `qv template validate`. All templates are checked on each run rather than
# only the changed ones: the set is small, and it avoids a third-party
# changed-files action and the diff-base edge cases that come with one.

# Runs on every pull request, not only ones that touch templates, so it can
# be a required status check: a required check that never starts would leave
# the pull request waiting. The run takes well under a minute.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: results go to the run summary, not a PR comment, so this
# also works on pull requests from forks.
permissions:
  contents: read

jobs:
  validate-templates:
    name: "Validate mission templates"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python comes from .python-version. activate-environment puts the
      # project's .venv on PATH, so the step below can call `qv` directly.
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true

      # A plain (non-editable) install with no dev tools, like a user's.
      - name: Install QuestVector
        run: uv sync --locked --no-dev --no-editable

      - name: Validate templates
        shell: bash
        run: |
          set -uo pipefail

          mapfile -d '' files < <(find templates -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 | sort -z)

          {
            echo "## Mission template validation"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No templates found under templates/." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "| Template | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for file in "${files[@]}"; do
            echo "::group::$file"
            if output=$(qv template validate "$file" 2>&1); then
              result="✅ valid"
            else
              result="❌ invalid"
              failed=$((failed + 1))
              echo "::error file=$file::Template validation failed"
            fi
            echo "$output"
            echo "::endgroup::"

            # Collapse output to one line and escape table pipes for the summary.
            detail=$(printf '%s' "$output" | tr '\n' ' ' | sed 's/|/\\|/g')
            safe_file=$(printf '%s' "$file" | sed 's/|/\\|/g')
            echo "| \`$safe_file\` | $result — $detail |" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo
            echo "**${#files[@]} checked, $failed failed.**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -gt 0 ]; then
            {
              echo
              echo "Run \`qv template validate <path> --fix\` locally to rescale category weights to 1.00. Other errors (YAML syntax, missing fields) need a manual edit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
