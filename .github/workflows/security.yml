name: "Security"

# Security scans on every pull request to main and every push to main,
# modeled on risk-trainer's CI (ADR-0011):
#   - gitleaks:  secrets anywhere in the git history.
#   - semgrep:   static analysis with the p/default rule set.
#   - pip-audit: known vulnerabilities in the versions locked in uv.lock.
# gitleaks and Semgrep also upload SARIF to the Security tab. Each scan keeps
# its exit code, so a finding fails the check and blocks the merge.
# CodeQL runs separately through GitHub's default setup, not a workflow file.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan git history
        run: >-
          ./gitleaks git --no-banner --redact --exit-code 1
          --report-format sarif --report-path gitleaks.sarif .
      - name: Upload SARIF to code scanning
        # Skipped for fork PRs (read-only token) and when the scan wrote no report.
        if: >-
          always() && hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan
        run: semgrep scan --config p/default --error --metrics=off --sarif-output=semgrep.sarif
      - name: Drop inline-suppressed results
        # Code scanning ignores SARIF suppressions, so approved inline skips would open alerts.
        if: always() && hashFiles('semgrep.sarif') != ''
        run: >-
          jq '.runs[].results |= ((. // []) | map(select(any(.suppressions[]?; .kind == "inSource") | not)))'
          semgrep.sarif > semgrep.tmp && mv semgrep.tmp semgrep.upload.sarif
      - name: Upload SARIF to code scanning
        # Skipped for fork PRs (read-only token) and when the scan wrote no report.
        if: >-
          always() && hashFiles('semgrep.upload.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.upload.sarif
          category: semgrep

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python comes from .python-version.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Audits every package in uv.lock (all extras and groups, every
      # platform) rather than what one install resolves (ADR-0013). The list
      # leaves out QuestVector itself, which isn't on PyPI; --strict would
      # fail on it as unauditable. Platform markers are stripped so the
      # macOS-only pyobjc packages are audited on this Linux runner too. The
      # list is fully pinned, so --no-deps skips a second resolve. A new
      # advisory against a locked version can still fail a run with no code
      # change.
      - name: Export the locked dependencies
        run: |
          uv export --locked --all-extras --all-groups --no-emit-project --no-hashes \
            --format requirements-txt | sed 's/ *;.*//' > audit-requirements.txt
      - name: Audit locked dependencies
        run: >-
          uv run --locked --only-group audit
          pip-audit --strict --disable-pip --no-deps -r audit-requirements.txt
