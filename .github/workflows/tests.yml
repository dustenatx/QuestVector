name: "Tests"

# Runs the test suite, type checks, and lint on every pull request to main
# and every push to main. Two install profiles:
#   - full:    the dev group plus every extra, so all tests run, including
#              the cloud AI provider tests that patch each SDK.
#   - minimal: the dev group only, proving the core works without any AI SDK
#              and that the provider tests skip cleanly rather than fail.
# Both install the exact versions in uv.lock (--locked fails if the lock is
# out of date with pyproject.toml) on Python 3.14 only (ADR-0013).
# No test needs a network connection, an API key, or a display.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "pytest (${{ matrix.profile }}, Python ${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        profile: [full, minimal]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install QuestVector
        run: |
          if [ "${{ matrix.profile }}" = "full" ]; then
            uv sync --locked --all-extras
          else
            uv sync --locked
          fi

      # The 90% floor (pyproject.toml) is enforced on the full install only.
      # The minimal install skips the 16 SDK tests, so its coverage sits near
      # the floor by design; its job is to prove the skip path works.
      - name: Run tests with coverage
        run: |
          if [ "${{ matrix.profile }}" = "full" ]; then FLOOR=""; else FLOOR="--cov-fail-under=0"; fi
          uv run --no-sync pytest --cov=questvector --cov-report=term-missing --cov-report=xml \
                 --junitxml=pytest-results.xml $FLOOR

      - name: Write summary
        if: always()
        shell: bash
        run: |
          uv run --no-sync python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          profile = os.environ["PROFILE"]
          version = os.environ["PYVER"]
          print(f"## Tests: {profile} install, Python {version}\n")
          try:
              suite = ET.parse("pytest-results.xml").getroot()
              suite = suite.find("testsuite") if suite.tag == "testsuites" else suite
              total, fail = int(suite.get("tests")), int(suite.get("failures"))
              err, skip = int(suite.get("errors")), int(suite.get("skipped"))
              print(f"**{total - fail - err - skip} passed, {fail + err} failed, {skip} skipped**\n")
          except (OSError, ET.ParseError, AttributeError, TypeError):
              print("Test results file not found; see the job log.\n")
          try:
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
              print(f"Line coverage: **{rate:.1%}** (minimum 90%)")
          except (OSError, ET.ParseError, TypeError):
              print("Coverage report not found; see the job log.")
          EOF
        env:
          PROFILE: ${{ matrix.profile }}
          PYVER: ${{ matrix.python-version }}

  static-checks:
    name: "mypy and pyflakes"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python comes from .python-version.
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install QuestVector
        run: uv sync --locked --all-extras

      - name: Type check (mypy)
        run: uv run --no-sync mypy questvector

      - name: Lint (pyflakes)
        run: uv run --no-sync pyflakes questvector tests
