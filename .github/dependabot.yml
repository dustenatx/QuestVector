# Weekly version updates for Python dependencies and GitHub Actions
# (ADR-0011). Security updates are enabled separately in the repository
# settings and arrive as soon as an advisory is published.
# Minor and patch bumps are grouped into one pull request per ecosystem;
# major bumps open their own pull request so each can be reviewed alone.
# A 7-day cooldown waits a week after a release before proposing it, so a
# compromised release has time to be caught and pulled first.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
