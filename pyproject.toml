[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "questvector"
dynamic = ["version"]
description = "QuestVector — local-first career navigation & flight deck platform (Python desktop implementation)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Dusten Harrison" }]

dependencies = [
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "pywebview>=5.1",
]

[project.optional-dependencies]
# Cloud LLM providers each ship as their own extra, so installing one
# doesn't pull in the other two SDKs. `llm` is a convenience extra that
# installs all three at once. The fourth supported provider, Ollama, needs
# no extra -- it's driven over plain HTTP via the standard library, since
# it's a local server the user runs themselves (see questvector/core/llm.py).
llm-anthropic = ["anthropic>=0.40"]
llm-openai = ["openai>=1.50"]
llm-gemini = ["google-genai>=0.3"]
llm = ["anthropic>=0.40", "openai>=1.50", "google-genai>=0.3"]

[dependency-groups]
# Contributor tools, not user install options (ADR-0013). uv installs the
# `dev` group by default; `audit` holds pip-audit so the auditor's own
# version is locked in uv.lock too.
dev = [
    "pytest>=8.0", "pytest-mock>=3.14", "pytest-cov>=5.0",
    "mypy>=1.10", "pyflakes>=3.2", "types-PyYAML", "types-reportlab",
]
audit = ["pip-audit==2.10.1"]

[project.scripts]
qv = "questvector.cli:main"

[tool.uv]
# The version CI pins in setup-uv; older uv may write an incompatible lock.
required-version = ">=0.13.1"
# Lock only releases at least 7 days old, matching Dependabot's cooldown, so
# a compromised release has time to be caught and pulled first (ADR-0013).
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: calls a real AI provider or local server; skipped unless opted in (see docs/DEVELOPMENT.md)",
]

[tool.setuptools.packages.find]
include = ["questvector*"]

[tool.setuptools.dynamic]
# Single source of truth for the app version: questvector/__init__.py's
# __version__. Packaging metadata (pip show, `qv --version`) is derived
# from it rather than duplicated here, so the two can't drift apart.
version = { attr = "questvector.__version__" }

[tool.setuptools.package-data]
questvector = ["data/starter_templates/*.yaml", "desktop/web/*"]

[tool.coverage.run]
source = ["questvector"]
branch = false

[tool.coverage.report]
# CI fails if line coverage drops below this (measured 95% on 18 Oct 2026).
fail_under = 90
show_missing = true
