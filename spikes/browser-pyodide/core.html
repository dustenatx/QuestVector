<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QV spike: core in Pyodide</title>
  <link rel="stylesheet" href="spike.css">
</head>
<body>
  <main>
    <h1>QuestVector core in Pyodide</h1>

      <thead><tr><th>Step</th><th>Result</th><th class="num">ms</th><th class="num">frozen ms</th><th>Detail</th></tr></thead>

    </table>
    <div id="downloads" class="row"></div>
    <div class="row"><button id="copy" type="button">Copy JSON</button></div>
    <pre id="report"></pre>
  </main>
  <script type="module" src="core.js"></script>
